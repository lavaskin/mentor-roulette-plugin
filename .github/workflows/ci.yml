name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$DALAMUD_HOME"

      - name: Restore
        id: restore
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test --no-restore -c Release

      - name: Build
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet build --no-restore -c Release

      - name: Upload the plugin
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: MentorRouletteTracker
          path: MentorRouletteTracker/bin/x64/Release/MentorRouletteTracker/latest.zip
          if-no-files-found: error
          retention-days: 7

      - name: Check comments
        if: ${{ !cancelled() }}
        uses: lavaskin/ffxiv-workflows/check-comments@feature/27-no-comments
